# Build with Nix -> test on Linux (sandbox + NixOS VM) -> test the tarball on
# Windows -> publish the exact Nix-built bytes to Azure Artifacts.
#
# Nix is the only thing that ever patches devbox-mcp. Later jobs only move and
# verify the .tgz it produced (sha512 checked at every hop).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
      tgz: ${{ steps.meta.outputs.tgz }}
      integrity: ${{ steps.meta.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM for the NixOS VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Patched build, sandboxed MCP probe + negative control against stock
      # upstream, NixOS VM test, npm tarball.
      - name: nix flake check
        run: nix flake check -L

      - name: Build npm tarball
        run: nix build .#npmTarball -o npm

      - name: Tarball is bit-for-bit reproducible
        run: nix build .#npmTarball --rebuild

      - id: meta
        run: |
          {
            echo "package=$(nix eval --raw .#npmTarball.packageName)"
            echo "version=$(nix eval --raw .#npmTarball.version)"
            echo "tgz=$(cat npm/name)"
            echo "integrity=$(cat npm/integrity)"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: npm/*.tgz
          if-no-files-found: error

  windows:
    needs: nix
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm

      - name: Verify artifact integrity
        shell: pwsh
        env:
          TGZ: npm/${{ needs.nix.outputs.tgz }}
          EXPECTED: ${{ needs.nix.outputs.integrity }}
        run: |
          $actual = node -e 'const c=require("crypto"),f=require("fs");process.stdout.write("sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' $env:TGZ
          if ($actual -ne $env:EXPECTED) { throw "integrity mismatch: $actual != $env:EXPECTED" }

      # Install exactly as a Windows user would (native deps: keytar, WAM broker)
      # and run the same MCP probe the Nix checks use.
      - name: Install tarball and probe
        shell: pwsh
        env:
          TGZ: ${{ github.workspace }}/npm/${{ needs.nix.outputs.tgz }}
          PACKAGE: ${{ needs.nix.outputs.package }}
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Set-Location smoke
          npm init -y | Out-Null
          npm install --no-audit --no-fund --registry https://registry.npmjs.org "$env:TGZ"
          if ($LASTEXITCODE) { throw "npm install failed" }
          $dist = "node_modules/$env:PACKAGE/dist"
          node ../nix/tests/probe.mjs "$dist/delete-guard.mjs" node "$dist/devbox-mcp-server.mjs"
          if ($LASTEXITCODE) { throw "probe failed" }

  publish:
    needs: [nix, windows]
    # Skipped (not failed) until the feed is configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_ARTIFACTS_NPM_REGISTRY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-artifacts
    permissions:
      contents: read
      id-token: write     # azure/login (OIDC) + build provenance
      attestations: write
    env:
      # e.g. https://pkgs.dev.azure.com/<org>/<project>/_packaging/<feed>/npm/registry/
      REGISTRY: ${{ vars.AZURE_ARTIFACTS_NPM_REGISTRY }}
      PACKAGE: ${{ needs.nix.outputs.package }}
      VERSION: ${{ needs.nix.outputs.version }}
      TGZ: npm/${{ needs.nix.outputs.tgz }}
      EXPECTED: ${{ needs.nix.outputs.integrity }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm

      - name: Verify artifact integrity
        run: |
          test -n "$REGISTRY" || { echo "::error::set repo variable AZURE_ARTIFACTS_NPM_REGISTRY"; exit 1; }
          actual="sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)"
          [ "$actual" = "$EXPECTED" ] || { echo "::error::integrity mismatch"; exit 1; }

      # Attestations work on public repos (any plan) or with GitHub Enterprise
      # Cloud; on a private personal repo the step would fail, so skip it there.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: ${{ env.TGZ }}

      # Preferred: workload identity federation, no stored secret. The service
      # principal must be added to the Azure DevOps org with Contributor on the feed.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Configure feed auth
        env:
          PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
          USE_OIDC: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: |
          feed="${REGISTRY#https:}"            # //pkgs.dev.azure.com/.../npm/registry/
          scope="${PACKAGE%%/*}"
          echo "${scope}:registry=${REGISTRY}" > "$HOME/.npmrc"
          if [ "$USE_OIDC" = "true" ]; then
            # 499b84ac-... is the Azure DevOps resource; Azure Artifacts accepts Entra bearer tokens.
            token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
            echo "::add-mask::$token"
            echo "${feed}:_authToken=${token}" >> "$HOME/.npmrc"
          elif [ -n "$PAT" ]; then
            pw=$(printf '%s' "$PAT" | base64 -w0)
            echo "::add-mask::$pw"
            {
              echo "${feed}:username=github-actions"
              echo "${feed}:_password=${pw}"
              echo "${feed}:email=npm@example.invalid"
            } >> "$HOME/.npmrc"
          else
            echo "::error::set vars.AZURE_CLIENT_ID/AZURE_TENANT_ID (OIDC) or secrets.AZURE_ARTIFACTS_PAT"
            exit 1
          fi

      # Same version + same bytes = no-op. Same version + different bytes means the
      # patch changed without bumping nix/publish.json `revision`: refuse.
      - name: Publish
        run: |
          if remote=$(npm view "$PACKAGE@$VERSION" version --registry "$REGISTRY" 2>/dev/null) && [ -n "$remote" ]; then
            remote_int=$(npm view "$PACKAGE@$VERSION" dist.integrity --registry "$REGISTRY" 2>/dev/null || true)
            remote_sha1=$(npm view "$PACKAGE@$VERSION" dist.shasum --registry "$REGISTRY" 2>/dev/null || true)
            if [ "$remote_int" = "$EXPECTED" ] || [ "$remote_sha1" = "$(sha1sum "$TGZ" | cut -d' ' -f1)" ]; then
              echo "::notice::$PACKAGE@$VERSION already published with identical bytes; nothing to do"
              exit 0
            fi
            echo "::error::$PACKAGE@$VERSION exists with different contents. Bump nix/publish.json revision."
            exit 1
          fi
          npm publish "$TGZ" --registry "$REGISTRY" --ignore-scripts
          echo "::notice::published $PACKAGE@$VERSION"
